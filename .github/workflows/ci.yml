name: CI — Sanos y Salvos

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─────────────────────────────────────────────
  # Build, tests y cobertura de cada microservicio
  # ─────────────────────────────────────────────
  test-java:
    name: Test ${{ matrix.service }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        service:
          - ms-user-auth
          - ms-pet-management
          - ms-geolocation
          - ms-matching-engine
          - ms-notification
          - bff
          - api-gateway

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanossalvos
          POSTGRES_PASSWORD: sanossalvos
          POSTGRES_DB: sanossalvos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # "verify" ejecuta tests + jacoco:check (valida umbral de cobertura configurado en pom.xml)
      - name: Tests con cobertura JaCoCo
        working-directory: ./${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sanossalvos
          SPRING_DATASOURCE_USERNAME: sanossalvos
          SPRING_DATASOURCE_PASSWORD: sanossalvos
          JWT_SECRET: ci_secret_no_usar_en_produccion_minimo_256_bits_xxxxxxxxxxx
        run: ./mvnw verify --no-transfer-progress

      # Resumen de cobertura en la pantalla del workflow (Job Summary)
      - name: Resumen de cobertura JaCoCo
        if: always()
        working-directory: ./${{ matrix.service }}
        run: |
          CSV="target/site/jacoco/jacoco.csv"
          if [ -f "$CSV" ]; then
            echo "## Cobertura JaCoCo — ${{ matrix.service }}" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "| Métrica | Cobertura |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----------|" >> $GITHUB_STEP_SUMMARY
            awk -F',' 'NR>1 {
              im+=$4; ic+=$5; bm+=$6; bc+=$7; lm+=$8; lc+=$9; mm+=$10; mc+=$11
            } END {
              printf "| Instrucciones | %d%% (%d/%d) |\n", ic/(ic+im)*100, ic, ic+im;
              printf "| Ramas         | %d%% (%d/%d) |\n", bc/(bc+bm)*100, bc, bc+bm;
              printf "| Líneas        | %d%% (%d/%d) |\n", lc/(lc+lm)*100, lc, lc+lm;
              printf "| Métodos       | %d%% (%d/%d) |\n", mc/(mc+mm)*100, mc, mc+mm;
            }' "$CSV" >> $GITHUB_STEP_SUMMARY
          fi

      # Reporte JaCoCo HTML (navegar cobertura por clase)
      - name: Subir reporte JaCoCo HTML
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-${{ matrix.service }}
          path: ${{ matrix.service }}/target/site/jacoco/
          retention-days: 14
          if-no-files-found: ignore

      # Resultados Surefire XML (registro por test — visible en herramientas externas)
      - name: Subir resultados de tests (Surefire XML)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: surefire-${{ matrix.service }}
          path: ${{ matrix.service }}/target/surefire-reports/
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Tests del frontend (Vitest)
  # ─────────────────────────────────────────────
  test-frontend:
    name: Test Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: ./frontend
        run: npm ci

      - name: Ejecutar tests con cobertura
        working-directory: ./frontend
        run: npm run test:coverage

      # Resumen en Job Summary
      - name: Resumen de tests frontend
        if: always()
        working-directory: ./frontend
        run: |
          echo "## Tests Frontend — Vitest" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "| Métrica | Cobertura |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|-----------|" >> $GITHUB_STEP_SUMMARY
            node -e "
              const s = require('./coverage/coverage-summary.json').total;
              ['lines','statements','functions','branches'].forEach(k => {
                console.log('| ' + k.charAt(0).toUpperCase()+k.slice(1) + ' | ' + s[k].pct + '% |');
              });
            " >> $GITHUB_STEP_SUMMARY
          fi

      - name: Build de producción
        working-directory: ./frontend
        run: npm run build

      # Reporte de cobertura HTML de Vitest
      - name: Subir reporte de cobertura frontend
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-frontend
          path: frontend/coverage/
          retention-days: 14
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # SonarQube (solo en push a main/develop)
  # ─────────────────────────────────────────────
  sonar:
    name: SonarQube — ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: test-java
    if: github.event_name == 'push'

    strategy:
      fail-fast: false
      matrix:
        service:
          - ms-user-auth
          - ms-pet-management
          - ms-geolocation
          - ms-matching-engine
          - ms-notification
          - bff

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sanossalvos
          POSTGRES_PASSWORD: sanossalvos
          POSTGRES_DB: sanossalvos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build y análisis SonarQube
        working-directory: ./${{ matrix.service }}
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/sanossalvos
          SPRING_DATASOURCE_USERNAME: sanossalvos
          SPRING_DATASOURCE_PASSWORD: sanossalvos
          JWT_SECRET: ci_secret_no_usar_en_produccion_minimo_256_bits_xxxxxxxxxxx
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          ./mvnw verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            --no-transfer-progress \
            -Dsonar.organization=sanos-y-salvos \
            -Dsonar.projectKey=sanos-y-salvos-${{ matrix.service }} \
            -Dsonar.projectName="Sanos y Salvos - ${{ matrix.service }}" \
            -Dsonar.host.url=${{ secrets.SONAR_HOST_URL }} \
            -Dsonar.token=${{ secrets.SONAR_TOKEN }} \
            -Dsonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml
